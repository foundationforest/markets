# Runs build/check.sh on every pull request and every push to main: every market file against
# build/market.schema.json and build/types.json, and directory.json and directory.md as the market
# files write them.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build/package-lock.json
      - run: build/check.sh
