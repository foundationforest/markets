# Runs build/check.sh on every pull request: every market file against build/market.schema.json
# and build/types.json, directory.json against the files, and directory.md as directory.json
# writes it.

name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build/package-lock.json
      - run: build/check.sh
