# Runs build/check.sh on every pull request and every push to main: every market file against
# build/market.schema.json, build/types.json and build/icons.json, each market live on main against
# its version here, and directory.json and directory.md as the market files write them. A pull
# request is compared with main; a push to main with the commit before the push, since main is then
# the pushed commit itself, so a pull request merged on a stale base still turns main red. Then the
# package in build/ type-checks, builds as every reader imports it, and passes its tests; a test
# that skips fails: the summary must say "# skipped 0".

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# shell: bash runs each step with pipefail, so a failing test fails its step through the tee.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build/package-lock.json
      - name: Fetch the commit live markets are compared with
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then commit=$BEFORE; else commit=refs/heads/main; fi
          git fetch --no-tags --depth=1 origin "$commit"
      - run: build/check.sh FETCH_HEAD
      - name: Type-check
        working-directory: build
        run: npm run check
      - name: Build
        working-directory: build
        run: npm run build
      - name: Test
        working-directory: build
        run: |
          npm test | tee "$RUNNER_TEMP/tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/tap"
