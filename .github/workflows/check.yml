# Runs ./check.sh on every pull request: each market file against schema/market.json, its path,
# its name, and its line in directory.md. A proposal is merged when this passes.

name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: ./check.sh
